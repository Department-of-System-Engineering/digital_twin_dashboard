openapi: 3.0.3

info:
    title: Dashboard API
    version: 1.2.0
    description: |
        HTTP API consumed by the digital twin dashboard.

        The dashboard uses `/api` as its default HTTP and WebSocket base path. During
        local development Vite proxies this path to the backend and removes the `/api`
        prefix before forwarding the request.

        WebSocket channels are documented in the `x-websocket-channels` extension.
        OpenAPI 3.0 and Swagger UI do not natively render WebSocket operations.

servers:
    - url: /api
      description: Dashboard default API base path

# The frontend does not send an API key or bearer token. Login state and role
# checks are currently maintained in React state only.
security: []

tags:
    - name: User
      description: User metadata endpoints

    - name: Process
      description: Process monitoring endpoints

    - name: Orders
      description: Order management

    - name: Products
      description: Product catalog

x-websocket-channels:
    /ws/process/products:
        description: Streams the complete current product-location snapshot.
        clientMessages: false
        serverMessage:
            type: array
            items:
                $ref: '#/components/schemas/ProcessStepProducts'

    /ws/sensors/chart:
        description: Streams live chart points after the client sends a subscription request.
        clientMessage:
            $ref: '#/components/schemas/ChartSubscriptionRequest'
        serverMessage:
            type: array
            items:
                $ref: '#/components/schemas/ChartData'

    /ws/orders/current:
        description: Streams the current order. A JSON null value means there is no current order.
        clientMessages: false
        serverMessage:
            nullable: true
            allOf:
                - $ref: '#/components/schemas/Order'

paths:
    /auth/login:
        post:
            operationId: login
            tags:
                - User
            summary: User login
            description: Authenticates a user with username and password
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
            responses:
                '200':
                    description: Login successful
                    content:
                        application/json:
                            schema:
                                type: boolean
                '401':
                    description: Wrong username or password
                    content:
                        application/json:
                            schema:
                                type: boolean
                                example: false
                '400':
                    description: Returns error message for frontend
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /user-types:
        get:
            operationId: getUserTypes
            tags:
                - User
            summary: Get user types
            description: Returns available user roles
            responses:
                '200':
                    description: List of user types
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/OptionItem'
                '400':
                    description: Returns error message for frontend
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /process/graph:
        get:
            operationId: getGraph
            tags:
                - Process
            summary: Get process graph
            description: Returns nodes and edges representing the process flow
            responses:
                '200':
                    description: Graph structure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Graph'
                '400':
                    description: Returns error message for frontend
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /process/products:
        get:
            operationId: getProcessProducts
            tags:
                - Process
            summary: Get products at process steps
            description: |
                Returns the complete current product-location snapshot used to annotate
                the process graph. Live replacements of this snapshot are sent through
                `/ws/process/products`.
            responses:
                '200':
                    description: Products grouped by process step
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/ProcessStepProducts'
                '400':
                    description: Returns error information for the frontend
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /process/{processId}:
        get:
            operationId: getProcess
            tags:
                - Process
            summary: Get process details
            description: Returns assets and sensors for a given process
            parameters:
                - name: processId
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: Process assets
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Asset'
                '400':
                    description: Returns error message for frontend
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /sensors/chart:
        post:
            operationId: getCharts
            tags:
                - Process
            summary: Get chart data
            description: Returns chart data for one or more sensors
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ChartRequest'
            responses:
                '200':
                    description: Chart data
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/ChartData'
                '400':
                    description: Returns error message for frontend
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /sensors:
        get:
            operationId: getSensorsDetails
            tags:
                - Process
            summary: Get sensor details
            description: Returns metadata for multiple sensors
            parameters:
                - name: sensorIDs
                  in: query
                  required: true
                  description: Sensor IDs serialized as repeated query parameters
                  style: form
                  explode: true
                  schema:
                      type: array
                      minItems: 1
                      items:
                          type: integer
            responses:
                '200':
                    description: Sensor details
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Sensor'
                '400':
                    description: Returns error message for frontend
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /products:
        get:
            operationId: getAvailableProducts
            tags:
                - Products
            summary: Get available products
            description: Returns all available products
            responses:
                '200':
                    description: Product list
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Product'
                '400':
                    description: Returns error message for frontend
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /orders:
        get:
            operationId: getOrders
            tags:
                - Orders
            summary: Get current orders
            description: Returns active orders
            responses:
                '200':
                    description: Order list
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/OrderListItem'
                '400':
                    description: Returns error message for frontend
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /orders/add:
        post:
            operationId: orderProducts
            tags:
                - Orders
            summary: Create order
            description: Requests an order for products
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required:
                                - products
                            properties:
                                products:
                                    type: array
                                    items:
                                        $ref: '#/components/schemas/Product'
                                details:
                                    $ref: '#/components/schemas/OrderEnrichment'
            responses:
                '200':
                    description: Order created
                    content:
                        application/json:
                            schema:
                                type: boolean
                '400':
                    description: Returns error message for frontend
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /orders/completed:
        get:
            operationId: getCompletedOrders
            tags:
                - Orders
            summary: Get completed orders
            description: Returns completed orders
            responses:
                '200':
                    description: Completed order list
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/OrderListItem'
                '400':
                    description: Returns error information for the frontend
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /orders/current:
        get:
            operationId: getCurrentOrder
            tags:
                - Orders
            summary: Get current order
            description: |
                Returns the order currently being processed. Updates are also sent
                through `/ws/orders/current`.
            responses:
                '200':
                    description: Current order details
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Order'
                '400':
                    description: Returns error information for the frontend
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                '404':
                    description: There is no current order
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /orders/{orderId}:
        get:
            operationId: getOrder
            tags:
                - Orders
            summary: Get order details
            description: Returns details of a specific order
            parameters:
                - name: orderId
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: Order details
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Order'
                '400':
                    description: Returns error message for frontend
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /orders/{orderId}/delete:
        delete:
            operationId: deleteOrder
            tags:
                - Orders
            summary: Delete order
            description: Deletes the specified order
            parameters:
                - name: orderId
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: Order deleted
                    content:
                        application/json:
                            schema:
                                type: boolean
                '400':
                    description: Returns error message for frontend
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /orders/{orderId}/complete:
        post:
            operationId: completeOrder
            tags:
                - Orders
            summary: Complete order
            description: Marks an order as completed
            parameters:
                - name: orderId
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: Order completed
                    content:
                        application/json:
                            schema:
                                type: boolean
                '400':
                    description: Returns error message for frontend
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /kpis/{userId}:
        get:
            operationId: getKPIs
            tags:
                - User
            summary: Get KPIs
            description: Returns KPIs for the current user
            parameters:
                - name: userId
                  in: path
                  required: true
                  schema:
                      type: integer
            responses:
                '200':
                    description: KPI list
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/BaseMetric'
                '400':
                    description: Returns error message for frontend
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
components:
    schemas:
        LoginRequest:
            type: object
            required:
                - username
                - password
            properties:
                username:
                    type: string
                password:
                    type: string

        OptionItem:
            type: object
            required:
                - id
                - name
            properties:
                id:
                    type: integer
                name:
                    type: string

        Graph:
            type: object
            required:
                - nodes
                - edges
            properties:
                nodes:
                    type: array
                    items:
                        $ref: '#/components/schemas/GraphNode'
                edges:
                    type: array
                    items:
                        $ref: '#/components/schemas/GraphEdge'

        GraphNode:
            type: object
            required:
                - id
                - name
            properties:
                id:
                    type: string
                name:
                    type: string

        GraphEdge:
            type: object
            required:
                - id
                - source
                - target
            properties:
                id:
                    type: string
                source:
                    type: string
                target:
                    type: string

        Asset:
            type: object
            required:
                - assetID
                - assetName
                - sensors
            properties:
                assetID:
                    type: integer
                assetName:
                    type: string
                sensors:
                    type: array
                    items:
                        $ref: '#/components/schemas/Sensor'

        BaseMetric:
            type: object
            required:
                - id
                - name
                - unit
                - value
                - type
            properties:
                id:
                    type: integer
                name:
                    type: string
                unit:
                    type: string
                value:
                    type: number
                type:
                    type: string
                    enum:
                        - int
                        - float
                        - percent

        Sensor:
            type: object
            required:
                - id
                - name
                - unit
                - type
            properties:
                id:
                    type: integer
                name:
                    type: string
                unit:
                    type: string
                type:
                    type: string
                    enum:
                        - int
                        - float
                        - percent
                value:
                    type: number
                min:
                    type: number
                disabled:
                    type: boolean
                color:
                    type: string
                    description: Optional chart color maintained by the dashboard
                axisID:
                    type: string
                    description: Optional chart axis assignment maintained by the dashboard

        ChartData:
            type: object
            description: Time series chart entry
            required:
                - xAxis
            properties:
                xAxis:
                    type: string
            additionalProperties:
                oneOf:
                    - type: number
                    - type: string

        ChartFilter:
            type: object
            description: Filter options for chart data
            required:
                - samplingFrequency
                - fromDate
                - toDate
            properties:
                samplingFrequency:
                    type: number

                fromDate:
                    type: string
                    format: date-time

                toDate:
                    type: string
                    format: date-time

        ChartRequest:
            type: object
            required:
                - sensorIds
                - filter
            properties:
                sensorIds:
                    type: array
                    minItems: 1
                    items:
                        type: integer
                filter:
                    $ref: '#/components/schemas/ChartFilter'

        ChartSubscriptionRequest:
            allOf:
                - $ref: '#/components/schemas/ChartRequest'
                - type: object
                  required:
                      - source
                  properties:
                      source:
                          type: string
                          enum:
                              - real

        TrackedProduct:
            type: object
            required:
                - productInstanceId
                - productType
            properties:
                productInstanceId:
                    type: integer
                productType:
                    type: string

        ProcessStepProducts:
            type: object
            required:
                - processStepId
                - products
            properties:
                processStepId:
                    type: string
                products:
                    type: array
                    items:
                        $ref: '#/components/schemas/TrackedProduct'

        Product:
            type: object
            required:
                - id
            properties:
                id:
                    type: string

                imageUrl:
                    type: string

                quantity:
                    type: integer

                maxQuantity:
                    type: integer

                completedQuantity:
                    type: integer

        OrderEnrichment:
            type: object
            required:
                - priority
            properties:
                customerName:
                    type: string

                fulfillmentDate:
                    type: string

                priority:
                    type: boolean

        OrderListItem:
            type: object
            required:
                - orderID
            properties:
                orderID:
                    type: string

                customerName:
                    type: string

                orderDate:
                    type: string

                fulfillmentDate:
                    type: string

                priority:
                    type: boolean

        Order:
            type: object
            required:
                - details
                - products
            properties:
                details:
                    $ref: '#/components/schemas/OrderListItem'

                products:
                    type: array
                    items:
                        $ref: '#/components/schemas/Product'

        Error:
            type: object
            properties:
                msg:
                    type: string
                detail:
                    description: Framework- or backend-specific error details
