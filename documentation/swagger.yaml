openapi: 3.0.3
info:
    title: Dashboard API
    version: 1.0.0

paths:
    /auth/login:
        post:
            summary: User login
            description: Authenticates a user with username and password
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/LoginRequest'
            responses:
                '200':
                    description: Login successful
                    content:
                        application/json:
                            schema:
                                type: boolean
                '401':
                    description: Wrong username or password
                    content:
                        application/json:
                            schema:
                                type: boolean
                                example: false
                '400':
                    description: Returns error message for frontend.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /user-types:
        get:
            summary: Get user types
            description: Returns available user roles
            responses:
                '200':
                    description: List of user types
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/OptionItem'
                '400':
                    description: Returns error message for frontend.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /graph:
        get:
            summary: Get process graph
            description: Returns nodes and edges representing the process flow
            responses:
                '200':
                    description: Graph structure
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Graph'
                '400':
                    description: Returns error message for frontend.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /process/{processId}:
        get:
            summary: Get process details
            description: Returns assets and sensors for a given process
            parameters:
                - name: processId
                  in: path
                  required: true
                  schema:
                      type: string
            responses:
                '200':
                    description: Process assets
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Asset'
                '400':
                    description: Returns error message for frontend.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /sensors/{sensorId}/chart:
        post:
            summary: Get sensor chart data
            description: Returns chart data for a sensor using a filter
            parameters:
                - name: sensorId
                  in: path
                  required: true
                  schema:
                      type: integer
            requestBody:
                required: false
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/ChartFilter'
            responses:
                '200':
                    description: Chart data
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Chart'
                '400':
                    description: Returns error message for frontend.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

    /sensors/{sensorId}:
        get:
            summary: Get sensor details
            description: Returns metadata for a sensor
            parameters:
                - name: sensorId
                  in: path
                  required: true
                  schema:
                      type: integer
            responses:
                '200':
                    description: Sensor details
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Sensor'
                '400':
                    description: Returns error message for frontend.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'

components:
    schemas:
        LoginRequest:
            type: object
            required:
                - username
                - password
            properties:
                username:
                    type: string
                password:
                    type: string

        OptionItem:
            type: object
            properties:
                id:
                    type: integer
                name:
                    type: string

        Graph:
            type: object
            properties:
                nodes:
                    type: array
                    items:
                        $ref: '#/components/schemas/GraphNode'
                edges:
                    type: array
                    items:
                        $ref: '#/components/schemas/GraphEdge'

        GraphNode:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string

        GraphEdge:
            type: object
            properties:
                id:
                    type: string
                source:
                    type: string
                target:
                    type: string

        Asset:
            type: object
            properties:
                assetID:
                    type: integer
                assetName:
                    type: string
                sensors:
                    type: array
                    items:
                        $ref: '#/components/schemas/Sensor'

        Sensor:
            type: object
            properties:
                id:
                    type: integer
                name:
                    type: string
                unit:
                    type: string
                value:
                    type: number
                type:
                    type: string
                    enum: [int, float, percent]
                min:
                    type: number
                    nullable: true
                disabled:
                    type: boolean
                    nullable: true

        Chart:
            type: object
            properties:
                name:
                    type: string
                value:
                    type: number

        Error:
            type: object
            properties:
                msg:
                    type: string

        ChartFilter:
            type: object
            description: Filter options for chart data
            properties:
                samplingFrequency:
                    type: number
                fromDate:
                    type: string
                toDate:
                    type: string
